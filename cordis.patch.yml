- insert:
    - id: aurabot-unified
      name: dsh-aurabot-unified
    - id: preset-aurabot-unified-qq-private
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aurabot-unified-qq-private
        name: Aurabot · 主人私聊
        description: 大肥鱼在 QQ 上和主人私聊时用：人格 + 完整工具
        order: 60
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{aurabot_unified_qq_persona}}\n\n{{aurabot_unified_qq_rules_private}}"
              # 人格独占系统提示词：不带 DSH 那一大段编程助手身份和工具指南（实测私聊从 1~4 分钟一轮降下来）。
              # 工具照样挂着，模型靠工具定义本身就会用。
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
    - id: preset-aurabot-unified-qq-private-long
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aurabot-unified-qq-private-long
        name: Aurabot · 主人私聊（长任务模式）
        description: 主人私聊 + 后台任务（jobs）和定时任务（schedule）：长任务跑完会自动唤醒她回报
        order: 62
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{aurabot_unified_qq_persona}}\n\n{{aurabot_unified_qq_rules_private}}"
              # 人格独占系统提示词：不带 DSH 那一大段编程助手身份和工具指南（实测私聊从 1~4 分钟一轮降下来）。
              # 工具照样挂着，模型靠工具定义本身就会用。
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # 长任务模式：后台跑命令、完成后自动唤醒；以及一次性/周期定时任务
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
    # 子智能体专用：插件 hub.runSubagentTurn 派活时指定（request.agentPreset）。
    # 不带人格（DSH 默认编程助手身份更适合执行自足任务书），只给本机操作工具；
    # 父级是 aurabot-unified-qq-social（零本地工具），子级不显式指定就会继承它、拿不到 shell——手机任务就废了。
    - id: preset-aurabot-unified-qq-subagent
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aurabot-unified-qq-subagent
        name: Aurabot · 子智能体
        description: 插件内部委派任务的子智能体用：无 QQ 人格，带本机命令与文件工具，自己动手完成自足任务
        order: 59
        plugins:
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: preset-aurabot-unified-qq-social
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aurabot-unified-qq-social
        name: Aurabot · 群聊
        description: 大肥鱼在 QQ 群和陌生人私聊时用：人格 + 只有 QQ 社交工具，没有任何电脑操作能力
        order: 61
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{aurabot_unified_qq_persona}}\n\n{{aurabot_unified_qq_rules_social}}"
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
